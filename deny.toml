# `cargo deny check`: known advisories, licenses, and where dependencies come from. Runs in CI;
# locally with `just audit`.
[graph]
targets = ["aarch64-apple-darwin"]

[advisories]
# Unmaintained crates that only GPUI uses, none of them on input PasteLoop does not ship itself.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: a compile-time macro in GPUI's Metal bindings" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: GPUI's SVG renderer, which draws only the bundled icons" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: the same SVG renderer's font database" },
]

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft, fine inside an MIT app).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# GPUI and the forks it pins (font-kit and others) come from Zed's repositories.
allow-org = { github = ["zed-industries"] }
