# Weekly update pull requests for crates.io dependencies and the pinned GitHub Actions. GPUI is
# pinned by git revision and updated by hand (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
