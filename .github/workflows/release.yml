name: Release

on:
  push:
    tags: ["v*"]
  # A dry run: builds, signs, notarizes, and verifies, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$GITHUB_REF_TYPE" == tag && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --release

      - name: Load the Developer ID certificate and notary key
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_B64: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          for name in DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD NOTARY_KEY_B64 NOTARY_KEY_ID NOTARY_ISSUER; do
            [[ -n "${(P)name}" ]] || { echo "secret for $name is not set" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 -D <<<"$DEVELOPER_ID_P12" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" ${(f)"$(security list-keychains -d user | tr -d '" ')"}
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"')"
          [[ -n "$identity" ]] || { echo "no Developer ID identity in the certificate secret" >&2; exit 1; }
          umask 077
          base64 -D <<<"$NOTARY_KEY_B64" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "CODESIGN_IDENTITY=$identity"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
        shell: zsh -euo pipefail {0}

      - name: Build, sign, notarize, and zip
        run: just package

      - name: Check the zip opens on a fresh Mac
        run: |
          check="$RUNNER_TEMP/check"
          mkdir "$check"
          ditto -x -k "dist/PasteLoop-$VERSION-arm64.zip" "$check"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$check/PasteLoop.app"
          xcrun stapler validate "$check/PasteLoop.app"
          spctl --assess --type execute --verbose=2 "$check/PasteLoop.app"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install

          Download the zip, unzip it, and move `PasteLoop.app` to `/Applications`. The app is
          signed with a Developer ID and notarized by Apple, so it opens like any other download.
          Requires an Apple Silicon Mac with macOS 15 or later.
          NOTES
          cat notes.md

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/PasteLoop-$VERSION-arm64.zip" \
            "dist/PasteLoop-$VERSION-arm64.zip.sha256" \
            --title "PasteLoop $VERSION" \
            --notes-file notes.md

      - name: Remove the signing keychain and notary key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary-key.p8"
